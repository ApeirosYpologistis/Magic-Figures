<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E8CFF"><meta name="description" content="Magic Figures: 51 number puzzles. Think. Arrange. Solve!">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Magic Figures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: phone-style app on mobile (bottom tab bar), left sidebar on desktop. Pastel backdrop, blue accent, white cards. */

/* Layout: phone-style app. Soft pastel backdrop, big blue heading, white rounded cards, colourful rounded-square tiles, floating centre tab. */
:root{
  --bg:#FDF3F6; --surface:#FFFFFF; --ink:#1C2340; --muted:#8089A3; --brand:#1E8CFF; --brand-deep:#0B63D1;
  --line:#D5E2F7; --slot:#EEF4FF; --ok:#27C48A; --ok-ink:#0C7A55; --warn:#FF9F1C; --warn-ink:#9A5B00; --bad:#FF5A6B; --bad-ink:#C0283A;
  --gold:#FFD45E; --shadow:0 8px 24px rgba(60,90,160,.12);
  --g1:#FFE3EC; --g2:#E6F0FF; --g3:#FFF0DC;
  --font-d:'Nunito','Poppins',system-ui,sans-serif; --font-b:'Nunito',Inter,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152B; --surface:#1D2142; --ink:#F2F4FF; --muted:#A3AAC8; --brand:#4DA3FF; --brand-deep:#8CC4FF;
  --line:#343B6A; --slot:#272C55; --ok:#3DD6A0; --ok-ink:#7BEBC4; --warn:#FFB84A; --warn-ink:#FFC978; --bad:#FF7A88; --bad-ink:#FF9DA8;
  --shadow:0 8px 24px rgba(0,0,0,.4); --g1:#2A1E3C; --g2:#15264A; --g3:#2C2436; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12152B; --surface:#1D2142; --ink:#F2F4FF; --muted:#A3AAC8; --brand:#4DA3FF; --brand-deep:#8CC4FF;
  --line:#343B6A; --slot:#272C55; --ok:#3DD6A0; --ok-ink:#7BEBC4; --warn:#FFB84A; --warn-ink:#FFC978; --bad:#FF7A88; --bad-ink:#FF9DA8;
  --shadow:0 8px 24px rgba(0,0,0,.4); --g1:#2A1E3C; --g2:#15264A; --g3:#2C2436; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-weight:600;font-size:16px;line-height:1.45;position:relative;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 12% 8%,#FF9F1C 0 5px,transparent 6px),radial-gradient(circle at 88% 14%,#4DA3FF 0 4px,transparent 5px),
   radial-gradient(circle at 6% 42%,#FF5A6B 0 4px,transparent 5px),radial-gradient(circle at 94% 55%,#27C48A 0 5px,transparent 6px),
   radial-gradient(circle at 20% 90%,#A78BFA 0 4px,transparent 5px),radial-gradient(circle at 80% 92%,#FFD45E 0 5px,transparent 6px),
   radial-gradient(120% 70% at 0% 0%,var(--g1),transparent 60%),radial-gradient(100% 60% at 100% 30%,var(--g2),transparent 60%),radial-gradient(100% 60% at 0% 100%,var(--g3),transparent 60%);}
a{color:inherit;text-decoration:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 130px}
.wrap.play{max-width:980px;padding-bottom:40px}
h1,h2,h3{font-family:var(--font-d);font-weight:900;margin:0;text-wrap:balance;line-height:1.1}
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.hd>div:first-child{flex:1;min-width:0}
.hi{margin:0 0 6px;color:var(--muted);font-size:.9rem}
.hd h1{font-size:clamp(2.2rem,9vw,3rem);color:var(--brand);letter-spacing:-.01em}
.hd .tag{color:var(--muted);font-weight:700}
.balloons{flex:none;width:86px;height:96px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border-radius:999px;padding:7px 16px;font-weight:800;font-size:.92rem;background:var(--surface);color:var(--muted);box-shadow:0 2px 8px rgba(60,90,160,.08)}
.pill.on{background:var(--slot);color:var(--brand-deep)}
.pill:focus-visible,.row:focus-visible,.hero:focus-visible,.back:focus-visible,.circ:focus-visible,.tabbar a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.lbl{display:flex;align-items:baseline;gap:8px;font-family:var(--font-d);font-weight:900;font-size:1.15rem;margin:14px 2px 10px}
.lbl small{color:var(--muted);font-weight:700;font-size:.82rem}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1E8CFF,#0F78F0);color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 12px 28px rgba(30,140,255,.35);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .thumb{width:92px;flex:none;border-radius:18px;background:rgba(255,255,255,.18);padding:8px;position:relative}
.hero .tx{flex:1 1 140px;min-width:0;position:relative}
.hero h2{font-size:1.5rem}.hero p{margin:4px 0 0;opacity:.92;font-size:.92rem}
.hero .go{display:inline-block;margin-top:12px;background:#fff;color:var(--brand-deep);border-radius:999px;padding:8px 18px;font-weight:900}
.stage{margin-top:6px}
.stage-h{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;scroll-margin-top:12px}
.stage-h .n{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;color:#1C2340;font-family:var(--font-d);font-weight:900}
.stage-h h2{font-size:1.2rem}
.stage-h .meta{flex:1;min-width:0;color:var(--muted);font-size:.85rem;font-weight:700}
.stage-h .prog{font-weight:900;color:var(--brand);font-size:.95rem}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);min-width:0;transition:transform .15s ease}
.row:hover{transform:translateY(-2px)}
.row.done{box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.row .sq{width:68px;height:68px;border-radius:20px;padding:8px;flex:none}
.row .sq svg,.hero .thumb svg,.avatar svg{width:100%;height:100%;display:block}
.row .tx{flex:1;min-width:0}
.row h3{font-size:1.1rem;overflow-wrap:anywhere}
.row .cat{color:var(--muted);font-size:.85rem;font-weight:700}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stars{letter-spacing:1px;font-size:1rem;color:var(--line);white-space:nowrap}
.stars .on{color:#FFB400}
.chev{color:var(--muted);font-size:1.4rem;line-height:1}
.t-ln{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.t-no{fill:rgba(255,255,255,.35);stroke:#fff;stroke-width:2.6}
.foot{color:var(--muted);font-size:.85rem;margin-top:22px;text-align:center}
/* tab bar */
.tabbar[hidden]{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.tabbar .in{pointer-events:auto;width:min(560px,100%);background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(60,90,160,.16);display:grid;grid-template-columns:1fr 92px 1fr;align-items:end;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 0}
.tabbar a.on{color:var(--brand)}
.tabbar svg{width:26px;height:26px}
.tabbar .mid{margin-top:-34px;color:var(--ink)}
.tabbar .orb{width:62px;height:62px;border-radius:50%;background:var(--surface);box-shadow:0 8px 20px rgba(60,90,160,.22);display:grid;place-items:center;color:var(--brand)}
.tabbar .orb svg{width:30px;height:30px}
/* play */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(60,90,160,.12);color:var(--ink);font-size:1.6rem;line-height:1;padding-bottom:3px}
.ph{text-align:center;margin-bottom:12px}
.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 8px;padding:12px;box-shadow:0 8px 22px rgba(60,90,160,.18)}
.ph h2{font-size:clamp(1.5rem,5vw,2rem)}
.ph .sub{color:var(--muted);font-weight:700;margin:4px 0 0;font-size:.95rem}
.how{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px;font-size:1.02rem}
.how .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--slot);color:var(--brand);display:grid;place-items:center}
.how .ic svg{width:22px;height:22px}
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"b" "t" "s" "a";gap:14px}
.boardbox{grid-area:b}.p-tray{grid-area:t;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 8px 28px rgba(60,90,160,.28)}.p-sums{grid-area:s}.act{grid-area:a}
@media (min-width:860px){.stagewrap{grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);grid-template-areas:"b t" "b s" "b a";grid-template-rows:auto auto 1fr;align-items:start;gap:16px}.p-tray{position:static;box-shadow:var(--shadow)}}
@media (max-width:859px){.p-tray .hint-d{display:none}.p-tray{padding:8px 10px}.p-tray h3{display:none}.tray{padding:4px;gap:8px;min-height:50px}.tray .tile{width:44px;height:44px;font-size:1.3rem}}
.boardbox{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:12px;display:grid;place-items:center}
.board{position:relative;container-type:inline-size;margin:0 auto}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.ln.idle,.ln.warn{stroke:var(--line)}.ln.ok{stroke:var(--ok);stroke-width:2}.ln.bad{stroke:var(--bad);stroke-width:2}
.slot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--line);background:var(--slot);transition:box-shadow .15s,border-color .15s}
.slot.over{border-color:var(--brand);box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 25%,transparent)}
.tile{display:grid;place-items:center;border-radius:28%;font-family:var(--font-d);font-weight:900;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.14),0 8px 14px rgba(60,90,160,.18);-webkit-tap-highlight-color:transparent}
.slot .tile{width:88%;height:88%;margin:6%;font-size:calc(var(--d)*.5cqw)}
.slot .tile.fixed{cursor:default;outline:3px solid var(--ink);outline-offset:-3px}
.tile.lift{opacity:.28}
.tile.pop{animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.c0{background:#1E8CFF;color:#fff}.c1{background:#27C48A;color:#06291C}.c2{background:#FFA53B;color:#3A2000}.c3{background:#FFD45E;color:#3A2E00}
.c4{background:#FF5A6B;color:#fff}.c5{background:#A78BFA;color:#1D0B4D}.c6{background:#FF8FC8;color:#3A0F26}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;transform:scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.panel{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px}
.panel h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:8px;border-radius:18px;border:2.5px dashed transparent;align-content:flex-start}
.tray.over{border-color:var(--brand);background:var(--slot)}
.tray .tile{width:clamp(46px,12vw,58px);height:clamp(46px,12vw,58px);font-size:1.5rem}
.tray .empty{color:var(--muted);font-size:.95rem;align-self:center}
.hint-d{color:var(--muted);font-size:.88rem;margin:8px 4px 0}
.sums{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chip{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;border-radius:14px;padding:8px 12px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.chip .e{font-family:var(--font-d);font-weight:900;font-size:1.05rem}
.chip .g{font-size:.82rem;color:var(--muted);font-weight:700;margin-left:auto}
.chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.chip.ok .e{color:var(--ok-ink)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}.chip.warn .e{color:var(--warn-ink)}
.chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.chip.bad .e{color:var(--bad-ink)}
.act{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:start}
.circ{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--muted)}
.circ i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;color:#fff;font-style:normal;font-size:1.6rem;box-shadow:0 8px 18px rgba(60,90,160,.25)}
.circ.b i{background:#1E8CFF}.circ.p i{background:#FF5A8C}.circ.off{visibility:hidden}
#check{appearance:none;border:0;border-radius:999px;background:linear-gradient(135deg,#27C48A,#1CA974);color:#fff;font-family:var(--font-d);font-weight:900;font-size:1.2rem;padding:17px 20px;cursor:pointer;box-shadow:0 5px 0 #138056,0 12px 22px rgba(39,196,138,.3);transition:transform .1s,box-shadow .1s;width:100%}
#check:hover{transform:translateY(-1px)}#check:active{transform:translateY(4px);box-shadow:0 1px 0 #138056}
#check:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.cm{display:flex;flex-direction:column;gap:8px;min-width:0}
#msg{min-height:1.5em;margin:0;font-weight:800;text-align:center}#msg.bad{color:var(--bad-ink)}#msg.warn{color:var(--warn-ink)}#msg.ok{color:var(--ok-ink)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.win{position:fixed;inset:0;z-index:80;background:rgba(18,21,43,.6);display:grid;place-items:center;padding:20px;overflow:hidden}
.win[hidden]{display:none}
.win .box{background:var(--surface);border-radius:32px;padding:28px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.win h2{font-size:2.2rem;color:var(--brand)}
.win .big{font-size:3rem;letter-spacing:6px;color:var(--line);margin:6px 0}.win .big .on{color:#FFB400}
.win .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.win .row2 a{border-radius:999px;padding:12px 20px;font-weight:900}
.win .a1{background:var(--brand);color:#fff}.win .a2{background:var(--slot);color:var(--brand-deep)}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.tile.pop,.win .box,.shake{animation:none}.row{transition:none}}
/* ===== v3: accounts, pages, sidebar ===== */
body{font-size:1rem}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation:none!important;transition:none!important}
.sidenav{display:none}
.tabbar .in{grid-template-columns:1fr 1fr 84px 1fr 1fr;padding-inline:8px}
.tabbar[hidden],.sidenav[hidden]{display:none!important}
@media (min-width:900px){
  body.has-side{padding-left:calc(248px + 20px)}
  .sidenav{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:30;background:var(--surface);box-shadow:var(--shadow);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
  .tabbar{display:none!important}
  .wrap{padding-bottom:48px}
}
.sn-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:900;font-size:1.2rem;color:var(--brand);padding:4px 8px 16px}
.sn-brand svg{width:40px;height:40px}
.sidenav a.l{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;font-weight:800;color:var(--muted)}
.sidenav a.l svg{width:22px;height:22px}
.sidenav a.l.on{background:var(--slot);color:var(--brand-deep)}
.sidenav a.l:hover{background:var(--slot)}
.sidenav a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sn-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--slot);font-weight:900;min-width:0}
.sn-me span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:grid;place-items:center;border-radius:50%;font-family:var(--font-d);font-weight:900;color:#1C2340;flex:none;box-shadow:0 4px 12px rgba(60,90,160,.2)}
.tabbar .in{align-items:end}
/* auth */
.auth{min-height:calc(100vh - 40px);display:grid;place-items:center;position:relative;z-index:1;padding-block:20px}
.authcard{width:min(420px,100%);background:var(--surface);border-radius:32px;box-shadow:var(--shadow);padding:26px 22px;text-align:center}
.authcard h1{font-size:2.3rem;color:var(--brand)}
.authcard .tag{color:var(--muted);font-weight:700}
.authcard .balloons{width:96px;height:106px;margin:0 auto 6px;display:block}
.seg{display:flex;background:var(--slot);border-radius:999px;padding:4px;margin:16px 0 4px}
.seg a{flex:1;padding:9px;border-radius:999px;font-weight:900;color:var(--muted)}
.seg a.on{background:var(--surface);color:var(--brand-deep);box-shadow:0 2px 8px rgba(60,90,160,.15)}
form label{display:block;text-align:left;font-weight:800;font-size:.9rem;margin:12px 0 6px;color:var(--muted)}
input[type=text],input[type=password],select{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;font-weight:700}
input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.err{color:var(--bad-ink);font-weight:800;min-height:1.4em;margin:10px 0 0;text-align:left}
.bigbtn{appearance:none;border:0;border-radius:999px;background:var(--brand);color:#fff;font-family:var(--font-d);font-weight:900;font-size:1.1rem;padding:15px 22px;cursor:pointer;width:100%;box-shadow:0 5px 0 var(--brand-deep);margin-top:8px}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-deep)}
.bigbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.bigbtn.soft{background:var(--slot);color:var(--brand-deep);box-shadow:none}
.bigbtn.danger{background:var(--bad);box-shadow:0 5px 0 #A93241}
.bigbtn.inline{width:auto;padding:12px 22px}
.guest{display:inline-block;margin-top:14px;font-weight:900;color:var(--brand-deep)}
.guest:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
.note{color:var(--muted);font-size:.82rem;margin:12px 0 0}
/* pages */
.pg-h{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.pg-h h1{font-size:clamp(1.8rem,7vw,2.4rem);color:var(--brand)}
.pg-h p{margin:2px 0 0;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;min-width:0}
.stat b{display:block;font-family:var(--font-d);font-size:1.6rem;color:var(--brand-deep);overflow-wrap:anywhere;line-height:1.15}
.stat span{color:var(--muted);font-size:.82rem;font-weight:800}
.card2{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.xp{height:12px;border-radius:99px;background:var(--slot);overflow:hidden;margin:8px 0 4px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#1E8CFF,#27C48A);border-radius:99px}
.sb{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:800;font-size:.9rem}
.sb .nm{width:84px;flex:none;color:var(--muted)}
.sb .bar{flex:1;height:12px;border-radius:99px;background:var(--slot);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:99px}
.sb .ct{width:36px;text-align:right;color:var(--brand-deep)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.ach .bd{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#FFD45E;color:#3A2E00;font-family:var(--font-d);font-weight:900;font-size:.9rem;flex:none}
.ach.lock{opacity:.6}.ach.lock .bd{background:var(--slot);color:var(--muted)}
.ach b{display:block;font-size:.95rem}.ach span{font-size:.8rem;color:var(--muted);font-weight:700}
.rk{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.rk.me{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.rk .no{width:28px;font-family:var(--font-d);font-weight:900;color:var(--muted);font-size:1.2rem}
.rk .tx{flex:1;min-width:0}.rk .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .tx span{color:var(--muted);font-size:.82rem;font-weight:700}
.rk .sc{font-family:var(--font-d);font-weight:900;color:var(--brand-deep);white-space:nowrap}
.week{display:flex;gap:8px;margin-top:12px}
.week span{flex:1;text-align:center;border-radius:14px;padding:8px 0;background:var(--slot);font-weight:900;font-size:.8rem;color:var(--muted)}
.week span.on{background:var(--ok);color:#06291C}
.count{font-family:var(--font-d);font-weight:900;font-size:2.4rem;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border:0}.opt label{margin:0;font-size:1rem;color:var(--ink);flex:1}.opt small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}
.opt select{width:auto;padding:10px 14px}
input.tg{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
input.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input.tg:checked{background:var(--ok)}input.tg:checked::after{transform:translateX(22px)}
input.tg:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw label{margin:0;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;inset:0}
.sw span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-family:var(--font-d);font-weight:900;border:3px solid transparent;color:#1C2340}
.sw input:checked+span{border-color:var(--ink);transform:scale(1.08)}
.sw input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.confirm{background:var(--slot);border-radius:18px;padding:14px;margin-top:10px}
.confirm[hidden]{display:none}
.confirm .rw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.clock{font-variant-numeric:tabular-nums}
.dchip{background:#FFD45E;color:#3A2E00;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.8rem;display:inline-block;margin-top:6px}
.win .gain{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.win .gain span{background:var(--slot);color:var(--brand-deep);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.9rem}
.win .badge{color:var(--ok-ink);font-weight:900;margin:6px 0 0}

const b64e=u=>btoa(String.fromCharCode(...u)),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:100000,hash:'SHA-256'},key,256);
    return b64e(new Uint8Array(bits));
  }

}

function statsOf(d){
  const sv=d.solves,n=sv.length,stars=Object.values(d.stars).reduce((a,b)=>a+b,0);
  const first=sv.filter(s=>s.wrong===0).length,xp=sv.reduce((a,s)=>a+(s.xp||0),0);
  const days=[...new Set(sv.map(s=>s.day))].sort();
  let best=0,run=0,prev=null;
  days.forEach(ds=>{const t=Date.parse(ds+'T00:00:00');run=(prev!==null&&Math.round((t-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=t;});
  let cur=0;
  if(days.length){const gap=Math.round((Date.parse(todayStr()+'T00:00:00')-Date.parse(days[days.length-1]+'T00:00:00'))/864e5);if(gap<=1)cur=run;}
  const cats={};sv.forEach(s=>cats[s.cat]=(cats[s.cat]||0)+1);
  const fav=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const catSolved={};Object.keys(d.stars).forEach(id=>{const c=byId[id]&&byId[id].cat;catSolved[c]=(catSolved[c]||0)+1;});
  return{n,solved:Object.keys(d.stars).length,stars,acc:n?Math.round(first/n*100):0,avg:n?Math.round(sv.reduce((a,s)=>a+s.t,0)/n):0,xp,level:Math.floor(xp/100)+1,xpIn:xp%100,
    cur,best,fav:fav?fav[0]:'None yet',fastest:n?Math.min(...sv.map(s=>s.t)):null,threes:Object.values(d.stars).filter(x=>x===3).length,catSolved,dailyDone:Object.keys(d.daily).length};
}

/* ---------- geometry ---------- */
function layout(p){
  const xs=p.nodes.map(n=>n[0]),ys=p.nodes.map(n=>n[1]);
  const x0=Math.min(...xs),y0=Math.min(...ys),bw=Math.max(...xs)-x0||1,bh=Math.max(...ys)-y0||1;
  let md=Infinity;
  for(let i=0;i<p.nodes.length;i++)for(let j=i+1;j<p.nodes.length;j++)md=Math.min(md,Math.hypot(xs[i]-xs[j],ys[i]-ys[j]));
  const RMAX=9.5,m=RMAX+1.5;
  const s=Math.min((100-2*m)/bw,(150-2*m)/bh);
  const r=Math.min(RMAX,.42*md*s);
  return{H:bh*s+2*m,r,pts:p.nodes.map(n=>[(n[0]-x0)*s+m,(n[1]-y0)*s+m])};
}

/* ---------- evaluation ---------- */
function evaluate(p,v){
  const items=[],groups={};
  p.cons.forEach((c,ci)=>{
    if(c.k==='sum'){
      const full=c.n.every(i=>v[i]!=null),sum=c.n.reduce((a,i)=>a+(v[i]||0),0);
      const it={c,ci,full,sum,state:'warn'};items.push(it);
      if(c.g)(groups[c.g]=groups[c.g]||[]).push(it);
      else if(full)it.state=sum===c.t?'ok':'bad';
    }else if(c.k==='gap'){
      const es=c.e.map(([a,b])=>{const d=v[a]!=null&&v[b]!=null;return{a,b,d,bad:d&&Math.abs(v[a]-v[b])<c.min};});
      const bad=es.filter(e=>e.bad).length,done=es.filter(e=>e.d).length;
      items.push({c,ci,es,bad,done,state:bad?'bad':(done===es.length?'ok':'warn')});
    }else if(c.k==='half'){
      const fa=c.a.every(i=>v[i]!=null),fb=c.b.every(i=>v[i]!=null);
      const sa=c.a.reduce((a,i)=>a+(v[i]||0),0),sb=c.b.reduce((a,i)=>a+(v[i]||0),0);
      items.push({c,ci,sa,sb,full:fa&&fb,state:fa&&fb?(2*sa===sb?'ok':'bad'):'warn'});
    }
  });
  for(const g in groups){
    const list=groups[g],done=list.filter(x=>x.full),sums=[...new Set(done.map(x=>x.sum))];
    done.forEach(x=>{x.state=sums.length>1?'bad':(done.length===list.length?'ok':'warn');});
  }
  return items;
}

/* ---------- thumbnails ---------- */
function thumb(p){
  const L=layout(p),r=L.r*.62;let s=`<svg viewBox="0 0 100 ${L.H.toFixed(1)}" aria-hidden="true">`;
  const seg=(a,b)=>`<line class="t-ln" x1="${L.pts[a][0]}" y1="${L.pts[a][1]}" x2="${L.pts[b][0]}" y2="${L.pts[b][1]}"/>`;
  p.cons.forEach(c=>{
    if(c.k==='sum'){s+=`<polyline class="t-ln" points="${c.n.map(i=>L.pts[i].join(',')).join(' ')}"/>`;}
    else if(c.k==='gap'){c.e.forEach(([a,b])=>s+=seg(a,b));}
  });
  (p.e||[]).forEach(([a,b])=>s+=seg(a,b));
  L.pts.forEach(q=>s+=`<circle class="t-no" cx="${q[0]}" cy="${q[1]}" r="${r}"/>`);
  return s+'</svg>';
}

  const rows=[...new Set(names)].map(n=>{const d=n===user?D:dataOf(n);return{n,d,s:statsOf(d)};}).sort((a,b)=>b.s.stars-a.s.stars||b.s.xp-a.s.xp);
  setPage(`<div class="pg-h"><div><h1>Leaderboard</h1><p>Ranked by stars on this device</p></div></div>
  ${rows.map((r,i)=>`<div class="rk${r.n===user?' me':''}"><span class="no">${i+1}</span>${av(r.n,r.d.avatar,44)}<div class="tx"><b>${esc(nice(r.n))}${r.n===user?' (you)':''}</b><span>Level ${r.s.level} · ${r.s.solved}/${ORDER.length} solved · ${r.s.acc}% first try</span></div><span class="sc">${r.s.stars} ★</span></div>`).join('')}
  <p class="note">${rows.length<2?'Create another account on this device to compete with a friend or family member. ':''}Rankings only include accounts on this browser. A worldwide leaderboard needs an online server.</p>`);
}

function renderMe(){
  const s=statsOf(D),got=new Set(unlocked(D));
  const bars=STAGES.map((st,i)=>{const n=st.ids.filter(id=>D.stars[id]).length;return `<div class="sb"><span class="nm">Stage ${st.n}</span><div class="bar"><i style="width:${n/st.ids.length*100}%;background:${SC[i]}"></i></div><span class="ct">${n}/${st.ids.length}</span></div>`;}).join('');
  const app=setPage(`<div class="pg-h"><span id="avbox">${av(user,D.avatar,72)}</span><div><h1>${esc(nice(user))}</h1><p>Level ${s.level} · ${s.xp} XP</p></div></div>
  <div class="card2"><b>Next level in ${100-s.xpIn} XP</b><div class="xp" role="progressbar" aria-valuenow="${s.xpIn}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.xpIn}%"></i></div>
   <fieldset style="border:0;padding:0;margin:14px 0 0"><legend style="font-weight:800;color:var(--muted);font-size:.9rem;padding:0">Avatar colour</legend><div class="sw">${AVC.map((c,i)=>`<label><input type="radio" name="avc" value="${i}" ${D.avatar===i?'checked':''} aria-label="Colour ${i+1}"><span style="background:${c}">${esc(nice(user)[0].toUpperCase())}</span></label>`).join('')}</div></fieldset></div>
  <div class="stats"><div class="stat"><b>${s.solved}/${ORDER.length}</b><span>Puzzles solved</span></div><div class="stat"><b>${s.stars}</b><span>Stars</span></div><div class="stat"><b>${s.acc}%</b><span>Solved first try</span></div><div class="stat"><b>${s.n?fmt(s.avg):'-'}</b><span>Average time</span></div>
   <div class="stat"><b>${s.cur}</b><span>Current streak (days)</span></div><div class="stat"><b>${s.best}</b><span>Best streak (days)</span></div><div class="stat"><b>${esc(s.fav)}</b><span>Favourite type</span></div><div class="stat"><b>${s.dailyDone}</b><span>Daily challenges</span></div></div>
  <div class="lbl">Progress by stage</div><div class="card2">${bars}</div>
  <div class="lbl">Badges<small>${got.size}/${ACH.length} earned</small></div><div class="achs">${ACH.map(a=>`<div class="ach${got.has(a.id)?'':' lock'}"><span class="bd">${a.i}</span><div><b>${a.n}</b><span>${a.d}</span></div></div>`).join('')}</div>
  <div class="lbl">Account</div><div class="card2"><p style="margin:0 0 8px">${user==='guest'?'You are playing as a guest. Progress is kept on this device.':'Signed in as <b>'+esc(user)+'</b>.'}</p>
   ${user==='guest'?'<a class="bigbtn inline" style="display:inline-block;text-align:center" href="#out-new">Create an account</a>':'<button class="bigbtn soft inline" type="button" id="lo">Log out</button>'}
   <a class="bigbtn soft inline" style="display:inline-block;text-align:center;margin-left:6px" href="#prefs">Settings</a></div>`);
  app.querySelectorAll('input[name=avc]').forEach(r=>r.addEventListener('change',()=>{D.avatar=+r.value;persist();$('#avbox').innerHTML=av(user,D.avatar,72);renderChrome('me');}));
  const lo=$('#lo');if(lo)lo.addEventListener('click',logout);
}
function logout(){user=null;D=null;S=null;LS.set('mf-session',null);location.hash='login';}

function renderPrefs(){
  const tg=(id,t,sub,on)=>`<div class="opt"><label for="${id}">${t}${sub?`<small>${sub}</small>`:''}</label><input class="tg" type="checkbox" role="switch" id="${id}" ${on?'checked':''}></div>`;
  const app=setPage(`<div class="pg-h"><div><h1>Settings</h1><p>Saved on this device</p></div></div>
  <div class="card2">${tg('o-snd','Sound effects','Taps, drops and the win jingle',SET.sound)}${tg('o-vib','Vibration','On phones that support it',SET.vib)}${tg('o-anim','Animations','Turn off for less movement and confetti',SET.anim)}
   <div class="opt"><label for="o-size">Text size</label><select id="o-size"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select></div>
   <div class="opt"><label for="o-theme">Theme</label><select id="o-theme"><option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div>
  <div class="card2"><h3 style="font-size:1rem;margin-bottom:6px">Reset progress</h3><p class="note" style="margin:0 0 10px">Erases stars, badges, streaks and times for ${esc(nice(user))}.</p>
   <button class="bigbtn soft inline" type="button" id="rs">Reset my progress</button>
   <div class="confirm" id="rc" hidden><b>Erase everything for this player?</b> This cannot be undone.<div class="rw"><button class="bigbtn danger inline" type="button" id="ry">Yes, erase it</button><button class="bigbtn soft inline" type="button" id="rn">Cancel</button></div></div></div>
  <div class="card2"><h3 style="font-size:1rem;margin-bottom:6px">About</h3><p style="margin:0">Magic Figures has 51 number puzzles in 10 stages. Place numbers in the circles so every line adds up as the rule says.</p>
   <h3 style="font-size:1rem;margin:14px 0 6px">Privacy</h3><p style="margin:0">Nothing leaves your device. Accounts, passwords (stored scrambled) and progress live in this browser only, so clearing site data deletes them.</p></div>
  ${user?'<button class="bigbtn soft inline" type="button" id="lo2">Log out</button>':''}`);
  $('#o-size').value=SET.size;$('#o-theme').value=SET.theme;
  const save=()=>{LS.set('mf-settings',SET);applySettings();};
  $('#o-snd').onchange=e=>{SET.sound=e.target.checked;save();sfx.drop();};
  $('#o-vib').onchange=e=>{SET.vib=e.target.checked;save();vib(30);};
  $('#o-anim').onchange=e=>{SET.anim=e.target.checked;save();};
  $('#o-size').onchange=e=>{SET.size=e.target.value;save();};
  $('#o-theme').onchange=e=>{SET.theme=e.target.value;save();};
  $('#rs').onclick=()=>{$('#rc').hidden=false;$('#ry').focus();};
  $('#rn').onclick=()=>{$('#rc').hidden=true;};
  $('#ry').onclick=()=>{const a=D.avatar;D=emptyData();D.avatar=a;persist();location.hash='map';};
  const l2=$('#lo2');if(l2)l2.onclick=logout;
}

/* ---------- play ---------- */
let S=null;
function renderPlay(id){
  const p=byId[id];if(!p){location.hash='map';return;}
  const st=stageOf[id],L=layout(p),idx=ORDER.indexOf(id),isDaily=id===dailyId()&&!D.daily[todayStr()];
  S={p,L,id,v:p.nodes.map((_,i)=>p.fixed&&p.fixed[i]!=null?p.fixed[i]:null),wrong:0,done:false,pop:-1,start:Date.now()};
  const prev=ORDER[idx-1],next=ORDER[idx+1];
  const app=setPage(`<div class="top"><a class="back" href="#map" aria-label="Back to all puzzles">‹</a><span></span></div>
  <div class="ph"><div class="avatar" style="background:${SC[st.n-1]}">${thumb(p)}</div><h2>${esc(p.name)}</h2><p class="sub">Stage ${st.n} · ${esc(st.name)} · ${esc(p.cat)} · <span class="clock" id="clock">0:00</span></p>${isDaily?'<span class="dchip">Daily challenge: +50 XP</span>':''}</div>
  <div class="how"><span class="ic">${ICON_BULB}</span><span>${esc(p.text)}</span></div>
  <div class="stagewrap"><div class="boardbox"><div class="board" id="board" style="width:min(100%,560px,calc(46vh*${(100/L.H).toFixed(3)}));aspect-ratio:100/${L.H.toFixed(2)}"></div></div>
  <div class="panel p-tray"><h3>Number tiles</h3><div class="tray" id="tray" data-tray></div><p class="hint-d">Drag a tile onto a circle. Drag a placed tile onto another to swap, or back here to take it off.</p></div>
  <div class="panel p-sums"><h3>Live totals</h3><ul class="sums" id="sums"></ul></div>
  <div class="act">${prev?`<a class="circ b" href="#p-${prev}" aria-label="Previous puzzle: ${esc(byId[prev].name)}"><i>‹</i>Back</a>`:'<span class="circ off"><i></i></span>'}
   <div class="cm"><button id="check" type="button">Check my answer</button><p id="msg" role="status" aria-live="polite"></p></div>
   ${next?`<a class="circ p" href="#p-${next}" aria-label="Next puzzle: ${esc(byId[next].name)}"><i>›</i>Next</a>`:'<span class="circ off"><i></i></span>'}</div></div>`,'play');
  $('#check').addEventListener('click',onCheck);
  $('#board').addEventListener('pointerdown',onDown);$('#tray').addEventListener('pointerdown',onDown);
  timers.push(setInterval(()=>{if(!S||S.done)return;const c=$('#clock');if(c)c.textContent=fmt(Math.floor((Date.now()-S.start)/1000));},1000));
  draw();
}

function draw(){
  const {p,L,v}=S,items=evaluate(p,v);S.items=items;
  const used=new Set(v.filter(x=>x!=null));
  // board
  let svg=`<svg viewBox="0 0 100 ${L.H.toFixed(2)}" aria-hidden="true">`;
  const P_=i=>L.pts[i].map(n=>n.toFixed(2)).join(',');
  (p.e||[]).forEach(([a,b])=>svg+=`<line class="ln idle" x1="${L.pts[a][0]}" y1="${L.pts[a][1]}" x2="${L.pts[b][0]}" y2="${L.pts[b][1]}"/>`);
  items.forEach(it=>{
    if(it.c.k==='sum'){const pts=it.c.n.map(P_).join(' ');svg+=it.c.closed?`<polygon class="ln ${it.state}" points="${pts}"/>`:`<polyline class="ln ${it.state}" points="${pts}"/>`;}
    else if(it.c.k==='gap')it.es.forEach(e=>svg+=`<line class="ln ${e.bad?'bad':(e.d?'ok':'idle')}" x1="${L.pts[e.a][0]}" y1="${L.pts[e.a][1]}" x2="${L.pts[e.b][0]}" y2="${L.pts[e.b][1]}"/>`);
  });
  svg+='</svg>';
  const d=(2*L.r).toFixed(2);
  p.nodes.forEach((_,i)=>{
    const fixed=p.fixed&&p.fixed[i]!=null,val=v[i];
    svg+=`<div class="slot" data-slot="${i}" style="left:${L.pts[i][0]}%;top:${(L.pts[i][1]/L.H*100).toFixed(3)}%;width:${d}%;--d:${d}">${val!=null?`<div class="tile ${cls(val)}${fixed?' fixed':''}${S.pop===i?' pop':''}" ${fixed?'':`data-tile data-from="node" data-idx="${i}"`} data-val="${val}">${val}</div>`:''}</div>`;
  });
  $('#board').innerHTML=svg;S.pop=-1;
  // tray
  const free=p.nums.filter(n=>!used.has(n));
  $('#tray').innerHTML=free.length?free.map(n=>`<div class="tile ${cls(n)}" data-tile data-from="tray" data-val="${n}">${n}</div>`).join(''):'<span class="empty">All tiles are on the board.</span>';
  // sums
  let k=0;
  $('#sums').innerHTML=items.map(it=>{
    const mark={ok:'✓',warn:'…',bad:'✕'}[it.state];
    if(it.c.k==='sum'){k++;const e=it.c.n.map(i=>v[i]??'_').join(' + ')+' = '+(it.full?it.sum:'?');
      const g=it.c.t!=null?`target ${it.c.t}`:'same as the other lines';
      return `<li class="chip ${it.state}"><span class="e">${mark} ${e}</span><span class="g">${g}</span></li>`;}
    if(it.c.k==='gap')return `<li class="chip ${it.state}"><span class="e">${mark} ${it.bad?it.bad+' touching pair'+(it.bad>1?'s':'')+' too close':'Joined circles differ by 2 or more'}</span><span class="g">${it.done}/${it.es.length} links filled</span></li>`;
    return `<li class="chip ${it.state}"><span class="e">${mark} Inner ${it.sa} × 2 = ${2*it.sa}</span><span class="g">outer total ${it.sb}${it.full?'':' so far'}</span></li>`;
  }).join('');
}

function setMsg(t,c){const m=$('#msg');m.textContent=t;m.className=c||'';}
function onCheck(){
  if(!S||S.done)return;
  const empty=S.v.filter(x=>x==null).length;
  if(empty){setMsg(`Fill every circle first. ${empty} to go.`,'warn');return;}
  const bad=S.items.filter(i=>i.state!=='ok').length;
  if(bad){S.wrong++;sfx.bad();vib([40,40,40]);setMsg(`Not yet. ${bad} of ${S.items.length} ${S.items.length===1?'rule is':'rules are'} red. Swap some tiles and try again.`,'bad');
    const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  S.done=true;
  const stars=3-Math.min(2,S.wrong),secs=Math.round((Date.now()-S.start)/1000),before=new Set(unlocked(D));
  const firstTime=!D.stars[S.id],isDaily=S.id===dailyId()&&!D.daily[todayStr()];
  const xp=(firstTime?stars*10+20:0)+(isDaily?50:0);
  D.stars[S.id]=Math.max(D.stars[S.id]||0,stars);
  D.solves.push({id:S.id,cat:S.p.cat,t:secs,wrong:S.wrong,stars,day:todayStr(),ts:Date.now(),daily:isDaily,xp});
  if(isDaily)D.daily[todayStr()]=true;
  persist();renderChrome('play');
  const fresh=ACH.filter(a=>!before.has(a.id)&&unlocked(D).includes(a.id));
  setMsg('Solved!','ok');sfx.win();vib([60,40,100]);showWin(stars,secs,xp,isDaily,fresh);
}
function showWin(stars,secs,xp,isDaily,fresh){
  const i=ORDER.indexOf(S.id),next=ORDER[i+1];
  const cols=['#1E8CFF','#27C48A','#FFD45E','#FF5A6B','#A78BFA','#FF8FC8'];
  let conf='';if(SET.anim)for(let k=0;k<36;k++)conf+=`<i class="conf" style="left:${Math.random()*100}%;background:${cols[k%6]};animation-duration:${2.2+Math.random()*2}s;animation-delay:${Math.random()*.6}s"></i>`;
  const w=$('#win');
  w.innerHTML=`${conf}<div class="box"><h2>Magic!</h2><div class="big" aria-label="${stars} of 3 stars">${[1,2,3].map(n=>`<span class="${n<=stars?'on':''}">★</span>`).join('')}</div><p>${stars===3?'Perfect, first try.':stars===2?'Great work, second try.':'Solved. Try for 3 stars next time.'}</p>
   <div class="gain"><span>Time ${fmt(secs)}</span><span>+${xp} XP</span>${isDaily?'<span>Daily bonus</span>':''}</div>${fresh.map(a=>`<p class="badge">New badge: ${esc(a.n)}</p>`).join('')}
   <div class="row2">${next?`<a class="a1" href="#p-${next}">Next puzzle →</a>`:''}<a class="a2" href="#map">All puzzles</a></div></div>`;
  w.hidden=false;
}

/* ---------- drag and drop ---------- */
let drag=null;
function onDown(e){
  if(!S||S.done||e.button>0)return;
  const t=e.target.closest('[data-tile]');if(!t)return;
  e.preventDefault();sfx.pick();
  const r=t.getBoundingClientRect();
  drag={t,from:t.dataset.from,idx:+t.dataset.idx,val:+t.dataset.val,x:e.clientX,y:e.clientY,moved:false,w:r.width,ghost:null,over:null,pid:e.pointerId};
  document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onCancel);
}
function targetAt(x,y){
  const slots=[...document.querySelectorAll('[data-slot]')];let best=null,bd=Infinity;
  slots.forEach(s=>{const r=s.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<r.width*.75&&d<bd){bd=d;best=s;}});
  if(best)return best;
  const el=document.elementFromPoint(x,y);return el&&el.closest('[data-tray]');
}
function onMove(e){
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
    drag.moved=true;const g=document.createElement('div');g.className='tile ghost '+cls(drag.val);g.textContent=drag.val;
    g.style.width=g.style.height=drag.w+'px';g.style.fontSize=getComputedStyle(drag.t).fontSize;document.body.appendChild(g);drag.ghost=g;drag.t.classList.add('lift');}
  drag.ghost.style.left=(e.clientX-drag.w/2)+'px';drag.ghost.style.top=(e.clientY-drag.w/2)+'px';
  const tg=targetAt(e.clientX,e.clientY);
  if(drag.over&&drag.over!==tg)drag.over.classList.remove('over');
  if(tg&&!(tg.dataset.slot!=null&&S.p.fixed&&S.p.fixed[+tg.dataset.slot]!=null)){tg.classList.add('over');drag.over=tg;}else drag.over=null;
}
function cleanup(){
  document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onCancel);
  if(drag){if(drag.ghost)drag.ghost.remove();if(drag.over)drag.over.classList.remove('over');drag.t.classList.remove('lift');}
}
function onCancel(){cleanup();drag=null;}
function onUp(e){
  const d=drag;cleanup();drag=null;if(!d||!d.moved)return;
  const tg=targetAt(e.clientX,e.clientY);if(!tg)return;
  const v=S.v,fixed=S.p.fixed||{};
  if(tg.dataset.slot!=null){
    const j=+tg.dataset.slot;if(fixed[j]!=null)return;
    if(d.from==='tray'){v[j]=d.val;}
    else{if(d.idx===j)return;const old=v[j];v[j]=d.val;v[d.idx]=old;if(old!=null)S.pop=d.idx;}
    S.pop=j;
  }else if(tg.hasAttribute('data-tray')){
    if(d.from==='node')v[d.idx]=null;else return;
  }
  setMsg('');sfx.drop();vib(12);draw();
}



/* ---------- router ---------- */
function route(){
  clearTimers();$('#win').hidden=true;
  const h=location.hash.replace('#','');
  if(h==='guest'){user='guest';LS.set('mf-session',user);loadData();location.replace('#map');return;}
  if(h==='out-new'){user=null;D=null;S=null;LS.set('mf-session',null);location.replace('#login-new');return;}
  if(!user){if(!h.startsWith('login')){location.replace('#login');return;}S=null;renderAuth(h==='login-new');renderChrome('login');window.scrollTo(0,0);return;}
  if(h.startsWith('login')){location.replace('#map');return;}
  if(D==null)loadData();
  let key='home';
  if(h.startsWith('p-')){renderPlay(h.slice(2));key='play';}
  else{S=null;
    if(h==='daily'){renderDaily();key='daily';}else if(h==='ranks'){renderRanks();key='ranks';}else if(h==='me'){renderMe();key='me';}else if(h==='prefs'){renderPrefs();key='prefs';}else renderHome();}
  renderChrome(key);window.scrollTo(0,0);
}
applySettings();if(user)loadData();
window.addEventListener('hashchange',route);
route();
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
